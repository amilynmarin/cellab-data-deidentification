[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellab-data-deidentification"
version = "0.1.1"
description = "Schema-driven, deterministic de-identification for flat research datasets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "CELLab Data De-identification Project"}]
keywords = ["research", "de-identification", "privacy", "pseudonymization", "clinical-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "pydantic>=2.6,<3",
  "pyreadstat>=1.2,<2",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

license = {text = "GPL-3.0-or-later"}

[project.urls]
Homepage = "https://github.com/amilynmarin/cellab-data-deidentification"
Repository = "https://github.com/amilynmarin/cellab-data-deidentification"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
cellab-deid = "research_deid.cli:main"
research-deid = "research_deid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_deid = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
